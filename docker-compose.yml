services:
  prefix-analyzer:
    build: .
    image: network-prefix-policy-analyzer:latest
    container_name: prefix-analyzer
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      PREFIX_DB_PATH: /data/prefix.db
    volumes:
      - prefix-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  prefix-data:
